# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

permissions:
  contents: read

concurrency:
  group: python-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.8, 3.9, "3.10", 3.11, 3.12, 3.13]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --editable '.[dev]'
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 flowdyn tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # Report all other style findings without failing legacy code.
        flake8 flowdyn tests --count --exit-zero --statistics
    - name: Test with pytest (without --mpl)
      run: pytest

  image-comparison:
    name: Matplotlib image comparison
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --editable '.[dev]' 'matplotlib<3.11' codecov
    - name: Test with coverage and compare Matplotlib images
      run: pytest --mpl --cov=flowdyn --cov-report=xml --mpl-generate-summary=html
    - name: Upload coverage to Codecov
      run: codecov
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    - name: Upload pytest-mpl report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pytest-mpl-report
        path: mpl-results/
        if-no-files-found: warn
